<div class="section">
  <h2>Normal Tabs</h2>
  <app-atomic-tabs [items]="items" [(selectedValue)]="selectedValue" ariaLabel="Normal tabs">
    <app-atomic-tab-panel value="tab1">
      <p>Content for Tab 1</p>
    </app-atomic-tab-panel>
    <app-atomic-tab-panel value="tab2">
      <p>Content for Tab 2</p>
    </app-atomic-tab-panel>
    <app-atomic-tab-panel value="tab3">
      <p>Content for Tab 3</p>
    </app-atomic-tab-panel>
  </app-atomic-tabs>
  <mat-divider style="margin: 16px 0" />
  <h2>Tabs with Unsaved-Changes Guard</h2>
  <app-atomic-tabs
    [items]="items2"
    [(selectedValue)]="selectedValue2"
    [beforeChange]="confirmLeave"
    ariaLabel="Tabs with unsaved-changes guard"
  >
    <app-atomic-tab-panel value="form1"><app-saveable-form key="form1" /></app-atomic-tab-panel>
    <app-atomic-tab-panel value="form2"><app-saveable-form key="form2" /></app-atomic-tab-panel>
    <app-atomic-tab-panel value="form3"><app-saveable-form key="form3" /></app-atomic-tab-panel>
  </app-atomic-tabs>
</div>

<ng-template #confirmDialog>
  <h2 mat-dialog-title>Unsaved changes</h2>
  <mat-dialog-content>You have unsaved changes. Are you sure you want to leave?</mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button [mat-dialog-close]="false">Cancel</button>
    <button mat-flat-button [mat-dialog-close]="true">Discard Changes</button>
  </mat-dialog-actions>
</ng-template>
